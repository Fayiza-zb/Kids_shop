services:
  - type: web
    name: kids-shopping-website
    runtime: docker          # Render has no native C runtime, so it builds the Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: ADMIN_PASSWORD  # you will be asked to type this when you create the Blueprint
        sync: false
      - key: ADMIN_TOKEN     # random secret, generated by Render
        generateValue: true
